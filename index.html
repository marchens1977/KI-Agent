<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KI-Agent Marc Hens</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0f172a; color: #f8fafc; }
    .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 1rem; }
    .input-field { background-color: #0f172a; border: 1px solid #475569; color: #f8fafc; border-radius: 0.75rem; padding: 0.75rem; width: 100%; }
    .input-field:focus { outline: none; border-color: #38bdf8; }
    .btn-primary { background-color: #0284c7; color: white; font-weight: 600; padding: 0.85rem 1.25rem; border-radius: 0.75rem; width: 100%; transition: background-color 0.2s; }
    .btn-primary:active { background-color: #0369a1; }
    .btn-success { background-color: #16a34a; color: white; font-weight: 600; padding: 0.85rem 1.25rem; border-radius: 0.75rem; width: 100%; }
    .btn-secondary { background-color: #334155; color: #e2e8f0; font-weight: 600; padding: 0.75rem 1rem; border-radius: 0.75rem; }
  </style>
</head>
<body class="pb-24">

  <header class="sticky top-0 z-20 bg-slate-900/95 backdrop-blur border-b border-slate-800 px-4 py-3 flex items-center justify-between">
    <div>
      <h1 class="text-lg font-bold text-sky-400">KI-Agent Office</h1>
      <p class="text-xs text-slate-400">Im Auftrag von Marc Hens</p>
    </div>
    <button id="authBtn" onclick="handleAuth()" class="btn-secondary text-xs">
      Outlook verbinden
    </button>
  </header>

  <nav class="grid grid-cols-3 gap-1 p-2 bg-slate-900 border-b border-slate-800 text-sm">
    <button onclick="switchTab('compose')" id="tab-compose" class="py-2 rounded-lg font-semibold bg-sky-600 text-white">Neuer Auftrag</button>
    <button onclick="switchTab('inbox')" id="tab-inbox" class="py-2 rounded-lg font-semibold text-slate-400">Posteingang</button>
    <button onclick="switchTab('settings')" id="tab-settings" class="py-2 rounded-lg font-semibold text-slate-400">Einrichtung</button>
  </nav>

  <main class="max-w-xl mx-auto p-4 space-y-4">

    <div id="statusBanner" class="hidden p-3 rounded-xl text-sm font-medium"></div>

    <!-- TAB 1: NEUER AUFTRAG -->
    <section id="view-compose" class="space-y-4">
      <div class="card p-4 space-y-4">
        <h2 class="text-base font-semibold text-slate-200">1. Dokument & Anweisung</h2>
        
        <div>
          <label class="block text-xs text-slate-400 mb-1">Schreiben abfotografieren oder PDF wählen</label>
          <input type="file" id="docInput" accept="image/*,application/pdf" capture="environment" onchange="handleFileSelect(event)" class="block w-full text-sm text-slate-300 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-sky-600 file:text-white">
          <p id="fileNameDisplay" class="text-xs text-sky-400 mt-1 hidden"></p>
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Was soll der KI-Agent erledigen?</label>
          <textarea id="instructionInput" rows="3" class="input-field text-sm" placeholder="Beispiel: Antworte der Versicherung, dass mir die Beitragserhöhung zu teuer ist, und bitte um Alternativangebote für günstigere Pakete."></textarea>
        </div>

        <button onclick="generateDraft()" id="generateBtn" class="btn-primary">
          Entwurf von KI erstellen lassen
        </button>
      </div>

      <!-- ENTWURF ZUM GEGENLESEN -->
      <div id="draftCard" class="card p-4 space-y-3 hidden">
        <div class="flex items-center justify-between">
          <h2 class="text-base font-semibold text-emerald-400">2. Entwurf gegenlesen & freigeben</h2>
          <label class="flex items-center gap-2 text-xs text-slate-300">
            <input type="checkbox" id="attachOriginal" checked class="rounded">
            Scan anhängen
          </label>
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Empfänger E-Mail-Adresse</label>
          <input type="email" id="draftTo" class="input-field text-sm" placeholder="service@versicherung.de">
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Betreff</label>
          <input type="text" id="draftSubject" class="input-field text-sm">
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Nachrichtentext (frei bearbeitbar)</label>
          <textarea id="draftBody" rows="11" class="input-field text-sm leading-relaxed"></textarea>
        </div>

        <button onclick="sendEmail()" id="sendBtn" class="btn-success">
          Freigeben & über Outlook senden
        </button>
      </div>
    </section>

    <!-- TAB 2: POSTEINGANG -->
    <section id="view-inbox" class="space-y-4 hidden">
      <div class="flex items-center justify-between">
        <h2 class="text-base font-semibold text-slate-200">Letzte Antworten im Postfach</h2>
        <button onclick="loadInbox()" class="btn-secondary text-xs">Aktualisieren</button>
      </div>
      <div id="inboxList" class="space-y-3">
        <p class="text-sm text-slate-400">Verbinde dich oben rechts mit Outlook und tippe auf Aktualisieren.</p>
      </div>
    </section>

    <!-- TAB 3: EINRICHTUNG -->
    <section id="view-settings" class="space-y-4 hidden">
      <div class="card p-4 space-y-4">
        <h2 class="text-base font-semibold text-slate-200">Zugangsdaten (bleiben lokal auf dem Handy)</h2>
        
        <div>
          <label class="block text-xs text-slate-400 mb-1">Google Gemini API-Schlüssel</label>
          <input type="password" id="geminiKeyInput" class="input-field text-sm" placeholder="AIzaSy...">
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Microsoft Entra Anwendungs-ID (Client-ID)</label>
          <input type="text" id="msClientIdInput" class="input-field text-sm" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx">
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Deine persönliche E-Mail für CC (optional)</label>
          <input type="email" id="ccEmailInput" class="input-field text-sm" placeholder="deine-adresse@gmx.de">
        </div>

        <button onclick="saveSettings()" class="btn-primary">Einstellungen speichern</button>
      </div>

      <div class="card p-4 text-xs text-slate-400 space-y-2">
        <p class="font-semibold text-slate-200">Deine aktuelle Redirect-URI für Microsoft Entra:</p>
        <code id="redirectUriDisplay" class="block p-2 bg-slate-950 rounded text-sky-400 break-all"></code>
      </div>
    </section>

  </main>

  <script>
    let msalInstance = null;
    let currentAccount = null;
    let uploadedFileBase64 = null;
    let uploadedFileMime = null;
    let uploadedFileName = null;

    const GRAPH_SCOPES = ["User.Read", "Mail.Read", "Mail.Send"];

    window.addEventListener("DOMContentLoaded", () => {
      document.getElementById("geminiKeyInput").value = localStorage.getItem("gemini_api_key") || "";
      document.getElementById("msClientIdInput").value = localStorage.getItem("ms_client_id") || "";
      document.getElementById("ccEmailInput").value = localStorage.getItem("cc_email") || "";
      document.getElementById("redirectUriDisplay").textContent = window.location.origin + window.location.pathname;
      initMsal();
    });

    function showBanner(msg, isError = false) {
      const banner = document.getElementById("statusBanner");
      banner.textContent = msg;
      banner.className = `p-3 rounded-xl text-sm font-medium ${isError ? "bg-red-950 text-red-200 border border-red-800" : "bg-emerald-950 text-emerald-200 border border-emerald-800"}`;
      banner.classList.remove("hidden");
      setTimeout(() => banner.classList.add("hidden"), 7000);
    }

    function switchTab(tab) {
      ["compose", "inbox", "settings"].forEach(t => {
        document.getElementById(`view-${t}`).classList.toggle("hidden", t !== tab);
        const btn = document.getElementById(`tab-${t}`);
        btn.className = t === tab
          ? "py-2 rounded-lg font-semibold bg-sky-600 text-white"
          : "py-2 rounded-lg font-semibold text-slate-400";
      });
      if (tab === "inbox" && currentAccount) loadInbox();
    }

    function saveSettings() {
      localStorage.setItem("gemini_api_key", document.getElementById("geminiKeyInput").value.trim());
      localStorage.setItem("ms_client_id", document.getElementById("msClientIdInput").value.trim());
      localStorage.setItem("cc_email", document.getElementById("ccEmailInput").value.trim());
      initMsal();
      showBanner("Einstellungen wurden sicher auf deinem Gerät gespeichert.");
    }

    function initMsal() {
      const clientId = localStorage.getItem("ms_client_id");
      if (!clientId) return;

      msalInstance = new msal.PublicClientApplication({
        auth: {
          clientId: clientId,
          authority: "https://login.microsoftonline.com/consumers",
          redirectUri: window.location.origin + window.location.pathname
        },
        cache: {
          cacheLocation: "localStorage",
          storeAuthStateInCookie: false
        }
      });

      const accounts = msalInstance.getAllAccounts();
      if (accounts.length > 0) {
        currentAccount = accounts[0];
        updateAuthButton();
      }
    }

    function updateAuthButton() {
      const btn = document.getElementById("authBtn");
      if (currentAccount) {
        btn.textContent = currentAccount.username;
        btn.className = "bg-emerald-900/60 border border-emerald-700 text-emerald-300 text-xs px-3 py-1.5 rounded-lg truncate max-w-[160px]";
      } else {
        btn.textContent = "Outlook verbinden";
        btn.className = "btn-secondary text-xs";
      }
    }

    async function handleAuth() {
      if (!msalInstance) {
        switchTab("settings");
        showBanner("Bitte trage zuerst deine Microsoft Client-ID ein.", true);
        return;
      }
      try {
        const loginResponse = await msalInstance.loginPopup({ scopes: GRAPH_SCOPES });
        currentAccount = loginResponse.account;
        updateAuthButton();
        showBanner(`Verbunden als ${currentAccount.username}`);
      } catch (err) {
        showBanner("Anmeldung abgebrochen oder fehlgeschlagen: " + err.message, true);
      }
    }

    async function getAccessToken() {
      if (!msalInstance || !currentAccount) {
        await handleAuth();
      }
      try {
        const response = await msalInstance.acquireTokenSilent({
          scopes: GRAPH_SCOPES,
          account: currentAccount
        });
        return response.accessToken;
      } catch (e) {
        const response = await msalInstance.acquireTokenPopup({ scopes: GRAPH_SCOPES });
        currentAccount = response.account;
        updateAuthButton();
        return response.accessToken;
      }
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;
      uploadedFileName = file.name;
      uploadedFileMime = file.type;
      const display = document.getElementById("fileNameDisplay");
      display.textContent = `Ausgewählt: ${file.name}`;
      display.classList.remove("hidden");

      const reader = new FileReader();
      reader.onload = () => {
        uploadedFileBase64 = reader.result.split(",")[1];
      };
      reader.readAsDataURL(file);
    }

    async function generateDraft() {
      const apiKey = localStorage.getItem("gemini_api_key");
      const instruction = document.getElementById("instructionInput").value.trim();

      if (!apiKey) {
        switchTab("settings");
        showBanner("Bitte hinterlege zuerst deinen Gemini API-Schlüssel.", true);
        return;
      }
      if (!instruction && !uploadedFileBase64) {
        showBanner("Bitte lade ein Dokument hoch oder gib eine Anweisung ein.", true);
        return;
      }

      const btn = document.getElementById("generateBtn");
      btn.disabled = true;
      btn.textContent = "KI analysiert Dokument & schreibt Entwurf...";

      const systemPrompt = `Du bist der persönliche KI-Korrespondenz-Agent von Marc Hens.
Analysiere das beigefügte Dokument (falls vorhanden) und die Anweisung des Nutzers.
Extrahiere nach Möglichkeit die E-Mail-Adresse des Empfängers, Versicherungsschein- oder Kundennummern und das Datum des Schreibens.
Formuliere eine höfliche, klare und professionelle E-Mail auf Deutsch.
WICHTIG: Beende jede E-Mail mit folgendem transparenten Hinweis in der Signatur:
"Mit freundlichen Grüßen
KI-Agent im Auftrag von Marc Hens
(Diese Nachricht wurde automatisiert durch einen digitalen Assistenten im ausdrücklichen Auftrag von Marc Hens erstellt und versendet.)"

Antworte ausschließlich im folgenden JSON-Format ohne Markdown-Codeblöcke:
{"to": "gefundene-email@beispiel.de oder leer lassen", "subject": "Passender Betreff inkl. Vertragsnummer", "body": "Vollständiger E-Mail-Text inkl. Signatur"}`;

      const parts = [{ text: `${systemPrompt}\n\nAnweisung von Marc Hens: ${instruction}` }];
      if (uploadedFileBase64) {
        parts.push({
          inline_data: {
            mime_type: uploadedFileMime,
            data: uploadedFileBase64
          }
        });
      }

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts }],
            generationConfig: { responseMimeType: "application/json" }
          })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message);

        const rawText = data.candidates[0].content.parts[0].text;
        const parsed = JSON.parse(rawText);

        document.getElementById("draftTo").value = parsed.to || "";
        document.getElementById("draftSubject").value = parsed.subject || "";
        document.getElementById("draftBody").value = parsed.body || "";
        document.getElementById("draftCard").classList.remove("hidden");
        document.getElementById("draftCard").scrollIntoView({ behavior: "smooth" });
      } catch (err) {
        showBanner("Fehler bei der KI-Erstellung: " + err.message, true);
      } finally {
        btn.disabled = false;
        btn.textContent = "Entwurf von KI erstellen lassen";
      }
    }

    async function sendEmail() {
      const to = document.getElementById("draftTo").value.trim();
      const subject = document.getElementById("draftSubject").value.trim();
      const body = document.getElementById("draftBody").value.trim();
      const ccEmail = localStorage.getItem("cc_email");
      const attachOriginal = document.getElementById("attachOriginal").checked;

      if (!to || !subject || !body) {
        showBanner("Bitte Empfänger, Betreff und Nachrichtentext prüfen.", true);
        return;
      }

      const btn = document.getElementById("sendBtn");
      btn.disabled = true;
      btn.textContent = "Wird über Outlook versendet...";

      try {
        const token = await getAccessToken();

        const messagePayload = {
          subject: subject,
          body: {
            contentType: "Text",
            content: body
          },
          toRecipients: [{ emailAddress: { address: to } }]
        };

        if (ccEmail) {
          messagePayload.ccRecipients = [{ emailAddress: { address: ccEmail } }];
        }

        if (attachOriginal && uploadedFileBase64) {
          messagePayload.attachments = [{
            "@odata.type": "#microsoft.graph.fileAttachment",
            name: uploadedFileName || "Dokument.pdf",
            contentType: uploadedFileMime,
            contentBytes: uploadedFileBase64
          }];
        }

        const res = await fetch("https://graph.microsoft.com/v1.0/me/sendMail", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ message: messagePayload, saveToSentItems: true })
        });

        if (!res.ok) {
          const errData = await res.json();
          throw new Error(errData.error?.message || "Versand fehlgeschlagen");
        }

        showBanner(`E-Mail erfolgreich an ${to} versendet!`);
        document.getElementById("draftCard").classList.add("hidden");
        document.getElementById("instructionInput").value = "";
        document.getElementById("docInput").value = "";
        document.getElementById("fileNameDisplay").classList.add("hidden");
        uploadedFileBase64 = null;
      } catch (err) {
        showBanner("Fehler beim Senden: " + err.message, true);
      } finally {
        btn.disabled = false;
        btn.textContent = "Freigeben & über Outlook senden";
      }
    }

    async function loadInbox() {
      const list = document.getElementById("inboxList");
      list.innerHTML = `<p class="text-sm text-slate-400">Lade Nachrichten aus Outlook...</p>`;

      try {
        const token = await getAccessToken();
        const res = await fetch("https://graph.microsoft.com/v1.0/me/mailFolders/inbox/messages?$top=10&$select=subject,from,receivedDateTime,bodyPreview", {
          headers: { "Authorization": `Bearer ${token}` }
        });
        const data = await res.json();

        if (!data.value || data.value.length === 0) {
          list.innerHTML = `<p class="text-sm text-slate-400">Keine Nachrichten im Posteingang vorhanden.</p>`;
          return;
        }

        list.innerHTML = data.value.map(mail => {
          const sender = mail.from?.emailAddress?.name || mail.from?.emailAddress?.address || "Unbekannt";
          const date = new Date(mail.receivedDateTime).toLocaleString("de-DE", { dateStyle: "short", timeStyle: "short" });
          return `
            <div class="card p-3 space-y-1">
              <div class="flex justify-between text-xs text-slate-400">
                <span class="font-semibold text-sky-400 truncate max-w-[65%]">${sender}</span>
                <span>${date}</span>
              </div>
              <p class="text-sm font-semibold text-slate-100">${mail.subject || "(Kein Betreff)"}</p>
              <p class="text-xs text-slate-300 line-clamp-3">${mail.bodyPreview || ""}</p>
            </div>
          `;
        }).join("");
      } catch (err) {
        list.innerHTML = `<p class="text-sm text-red-400">Fehler beim Abrufen: ${err.message}</p>`;
      }
    }
  </script>
</body>
</html>
